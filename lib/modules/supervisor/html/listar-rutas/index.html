        // Current quantity displayed

        /**
         * Creates a route card HTML element
         * @param {Object} route - Route data object
         * @returns {string} HTML string for the card
         */
        function createRouteCard(route) {
            return `
                <div class="route-card" data-route-id="${route.id}">
                    <div class="card-info">
                        <div class="info-main">
                            <h3 class="route-title">${route.title}</h3>
                            <div class="tags-container">
                                <span class="tag tag-sector">
                                    <svg class="tag-icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                        <path d="M9 5V13M5 9H13" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                    </svg>
                                    ${route.sector}
                                </span>
                                <span class="tag tag-schedule">
                                    <svg class="tag-icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                        <circle cx="9" cy="9" r="1.5" fill="currentColor"/>
                                    </svg>
                                    ${route.schedule}
                                </span>
                            </div>
                        </div>
                        <div class="volunteers-info">
                            <div class="volunteer-avatars">
                                <div class="avatar avatar-1">👩</div>
                                <div class="avatar avatar-2">👨</div>
                                <div class="avatar avatar-count">+${route.activeVolunteers}</div>
                            </div>
                            <span class="volunteers-label">Voluntarios activos ahora</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-view" onclick="viewRoute(${route.id})">
                            Ver
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
        }

        /**
         * Renders the routes list with specified quantity
         * @param {number|string} quantity - Number of routes to show or 'all'
         */
        function renderRoutes(quantity) {
            const routesList = document.getElementById('routesList');
            let routesToDisplay = allRoutes;

            // Handle quantity filtering
            if (quantity !== 'all') {
                const num = parseInt(quantity);
                routesToDisplay = allRoutes.slice(0, num);
            }

            // Generate HTML for all routes
            const routesHTML = routesToDisplay
                .map(route => createRouteCard(route))
                .join('');

            routesList.innerHTML = routesHTML;
        }

        /**
         * Changes the quantity of routes displayed
         * @param {string} quantity - Number of routes to show or 'all'
         */
        function changeQuantity(quantity) {
            currentQuantity = quantity;
            renderRoutes(quantity);
        }

        /**
         * Navigate to create route page
         */
        function goToCreateRoute() {
            window.location.href = '../crear-ruta/page1.html';
        }

        /**
         * View a specific route
         * @param {number} routeId - Route ID
         */
        function viewRoute(routeId) {
            window.location.href = `../detalles-ruta/index.html?id=${routeId}`;
        }

        /**

         * @param {string} section - Section name
         */
        function navigateTo(section) {
            console.log('Navigate to:', section);
            // Implement actual navigation based on section
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            renderRoutes(currentQuantity);
        });
