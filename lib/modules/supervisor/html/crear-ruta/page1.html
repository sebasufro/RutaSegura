<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ruta Social - Paso 1</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="global-crear-ruta.css">
    <link rel="stylesheet" href="page1.css">
</head>
<body>
    <div class="page-container">
        <!-- Topbar -->
        <div class="topbar">
            <div class="topbar-content">
                <div class="logo-container">
                    <svg class="logo" viewBox="0 0 28 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="14" cy="13" r="12" stroke="#1e3a8a" stroke-width="2" fill="none"/>
                        <path d="M10 13L12 15L18 9" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                    <h2 class="brand-name">RUTA SEGURA</h2>
                </div>
            </div>
        </div>

        <!-- Page Title -->
        <div class="page-title">
            <h1>Crear Ruta Social</h1>
        </div>

        <!-- Step Indicator -->
        <div class="step-indicator">Paso 1 de 3</div>

        <!-- Main Form Section -->
        <div class="card-section">
            <h3 class="section-title">Información general de la ruta</h3>

            <div class="form-group">
                <label class="form-label">Fecha</label>
                <input type="text" class="form-input" placeholder="DD-MM-AAAA" id="fecha">
            </div>

            <div class="form-group-row">
                <div>
                    <label class="form-label">Horario Inicio</label>
                    <input type="text" class="form-input" placeholder="HH:MM" id="horarioInicio">
                </div>
                <div>
                    <label class="form-label">Horario Termino</label>
                    <input type="text" class="form-input" placeholder="HH:MM" id="horarioTermino">
                </div>
            </div>

            <div>
                <label class="form-label">Cantidad de Voluntarios</label>
                <div class="form-group-row">
                    <div>
                        <label class="form-label">Mínimo</label>
                        <input type="number" class="form-input" placeholder="0" id="voluntariosMin" value="0">
                    </div>
                    <div>
                        <label class="form-label">Máximo</label>
                        <input type="number" class="form-input" placeholder="0" id="voluntariosMax" value="0">
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="buttons-container">
            <button class="btn btn-primary" onclick="goToPage(2)">
                <span>Siguiente</span>
                <span class="btn-icon">→</span>
            </button>
            <button class="btn btn-secondary" onclick="exitForm()">
                <span class="btn-icon">←</span>
                <span>Volver</span>
            </button>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="../listar-rutas/index.html" class="nav-item">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L15.09 10.26H24L17.55 15.82L20.64 24L12 18.44L3.36 24L6.45 15.82L0 10.26H8.91L12 2Z" fill="currentColor"/>
                </svg>
                <span class="nav-label">RUTAS</span>
            </a>
            <a href="../mapa-ruta/index.html" class="nav-item">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" fill="currentColor"/>
                </svg>
                <span class="nav-label">MAPA</span>
            </a>
            <a href="../perfil/index.html" class="nav-item active">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" fill="currentColor"/>
                    <path d="M12 14c-6 0-8 3-8 3v7h16v-7s-2-3-8-3z" fill="currentColor"/>
                </svg>
                <span class="nav-label">PERFIL</span>
            </a>
        </nav>
    </div>

    <script>
        // Store form data in sessionStorage
        function saveFormData() {
            const data = {
                fecha: document.getElementById('fecha').value,
                horarioInicio: document.getElementById('horarioInicio').value,
                horarioTermino: document.getElementById('horarioTermino').value,
                voluntariosMin: document.getElementById('voluntariosMin').value,
                voluntariosMax: document.getElementById('voluntariosMax').value
            };
            sessionStorage.setItem('rutaData', JSON.stringify(data));
        }

        function goToPage(pageNum) {
            saveFormData();
            window.location.href = `page${pageNum}.html`;
        }

        function exitForm() {
            // You can change this to point to the main supervisor dashboard
            if (confirm('¿Deseas abandonar el formulario?')) {
                window.location.href = '../listar-rutas/index.html';
            }
        }

        function navigateTo(section) {
            // Placeholder for navigation
            console.log('Navigate to:', section);
        }

        // Load saved data if returning to this page
        window.addEventListener('DOMContentLoaded', function() {
            const savedData = sessionStorage.getItem('rutaData');
            if (savedData) {
                const data = JSON.parse(savedData);
                if (data.fecha) document.getElementById('fecha').value = data.fecha;
                if (data.horarioInicio) document.getElementById('horarioInicio').value = data.horarioInicio;
                if (data.horarioTermino) document.getElementById('horarioTermino').value = data.horarioTermino;
                if (data.voluntariosMin) document.getElementById('voluntariosMin').value = data.voluntariosMin;
                if (data.voluntariosMax) document.getElementById('voluntariosMax').value = data.voluntariosMax;
            }
        });
    </script>
</body>
</html>
