<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Ruta Segura</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="header-title">Configuración</h1>
            <div class="header-spacer"></div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Configuration Menu -->
            <section class="config-menu">
                <!-- Mis Direcciones -->
                <a href="direcciones.html" class="config-item">
                    <div class="config-icon" style="background-color: #E7ECFB;">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="#1E3A8A">
                            <path d="M16 4C11.6 4 8 7.6 8 12C8 18 16 28 16 28S24 18 24 12C24 7.6 20.4 4 16 4ZM16 15C14.9 15 14 14.1 14 13C14 11.9 14.9 11 16 11C17.1 11 18 11.9 18 13C18 14.1 17.1 15 16 15Z"/>
                        </svg>
                    </div>
                    <div class="config-content">
                        <h3 class="config-title">Mis Direcciones</h3>
                        <p class="config-desc">Casa, trabajo y lugares frecuentes</p>
                    </div>
                    <svg class="config-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5l7 7-7 7"/>
                    </svg>
                </a>

                <!-- Contactos de Emergencia -->
                <a href="contactos.html" class="config-item">
                    <div class="config-icon" style="background-color: #FFE7E7;">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="#BA1A1A">
                            <path d="M16 2C8.27 2 2 8.27 2 16S8.27 30 16 30S30 23.73 30 16S23.73 2 16 2ZM16 8C17.66 8 19 9.34 19 11S17.66 14 16 14S13 12.66 13 11S14.34 8 16 8ZM16 26C13.67 26 11.59 25.09 10.16 23.57C11.06 21.9 13.37 20.5 16 20.5S20.94 21.9 21.84 23.57C20.41 25.09 18.33 26 16 26Z"/>
                        </svg>
                    </div>
                    <div class="config-content">
                        <h3 class="config-title">Contactos de Emergencia</h3>
                        <p class="config-desc">Personas de confianza para alertas</p>
                    </div>
                    <svg class="config-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5l7 7-7 7"/>
                    </svg>
                </a>

                <!-- Ajustes de Preferencia -->
                <a href="../../global/configuración/index.html" class="config-item">
                    <div class="config-icon" style="background-color: #E3E7FF;">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="#4C63D2">
                            <path d="M16 10C12.7 10 10 12.7 10 16S12.7 22 16 22S22 19.3 22 16S19.3 10 16 10ZM16 20C13.8 20 12 18.2 12 16S13.8 12 16 12S20 13.8 20 16S18.2 20 16 20ZM20.7 12.3C20.93 12.53 21.33 12.53 21.56 12.3L23.4 10.46C23.63 10.23 23.63 9.83 23.4 9.6L21.4 7.6C21.17 7.37 20.77 7.37 20.54 7.6L18.7 9.44C18.47 9.67 18.47 10.07 18.7 10.3L20.7 12.3Z"/>
                        </svg>
                    </div>
                    <div class="config-content">
                        <h3 class="config-title">Ajustes de Preferencia</h3>
                        <p class="config-desc">Notificaciones, idioma y privacidad</p>
                    </div>
                    <svg class="config-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5l7 7-7 7"/>
                    </svg>
                </a>
            </section>

            <!-- Logout Section -->
            <section class="logout-section">
                <button class="logout-btn" onclick="handleLogout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                    Cerrar Sesión
                </button>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="../listar-rutas/index.html" class="nav-item">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L15.09 10.26H24L17.55 15.82L20.64 24L12 18.44L3.36 24L6.45 15.82L0 10.26H8.91L12 2Z" fill="currentColor"/>
                </svg>
                <span class="nav-label">RUTAS</span>
            </a>
            <a href="../mapa-ruta/index.html" class="nav-item">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" fill="currentColor"/>
                </svg>
                <span class="nav-label">MAPA</span>
            </a>
            <a href="../perfil/index.html" class="nav-item active">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" fill="currentColor"/>
                    <path d="M12 14c-6 0-8 3-8 3v7h16v-7s-2-3-8-3z" fill="currentColor"/>
                </svg>
                <span class="nav-label">PERFIL</span>
            </a>
        </nav>
    </div>

    <script>
        function handleLogout() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                // Redirect to login page
                window.location.href = '../../global/inicio-sesion/index.html';
            }
        }
    </script>
</body>
</html>
