<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos de Emergencia - Ruta Segura</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="contactos.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="header-title">Contactos de Emergencia</h1>
            <div class="header-spacer"></div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Contacts List -->
            <section class="contacts-list">
                <!-- Contact Card 1 -->
                <div class="contact-card">
                    <div class="contact-avatar">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="#E7ECFB">
                            <circle cx="20" cy="20" r="20"/>
                            <circle cx="20" cy="14" r="6" fill="#1E3A8A"/>
                            <path d="M28 28C28 25 25 23 20 23S12 25 12 28V32H28V28Z" fill="#1E3A8A"/>
                        </svg>
                    </div>
                    <div class="contact-info">
                        <h3 class="contact-name">María García</h3>
                        <p class="contact-relation">Hermana</p>
                        <p class="contact-phone">+56 9 3310 5678</p>
                    </div>
                    <div class="contact-actions">
                        <button class="action-btn edit-btn" onclick="editContact(1)" title="Editar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L21 3z"/>
                            </svg>
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteContact(1)" title="Eliminar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Contact Card 2 -->
                <div class="contact-card">
                    <div class="contact-avatar">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="#FFE7E7">
                            <circle cx="20" cy="20" r="20"/>
                            <circle cx="20" cy="14" r="6" fill="#BA1A1A"/>
                            <path d="M28 28C28 25 25 23 20 23S12 25 12 28V32H28V28Z" fill="#BA1A1A"/>
                        </svg>
                    </div>
                    <div class="contact-info">
                        <h3 class="contact-name">Carlos Martínez</h3>
                        <p class="contact-relation">Papá</p>
                        <p class="contact-phone">+56 9 3312 3456</p>
                    </div>
                    <div class="contact-actions">
                        <button class="action-btn edit-btn" onclick="editContact(2)" title="Editar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L21 3z"/>
                            </svg>
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteContact(2)" title="Eliminar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Add Contact Button -->
            <div class="add-button-container">
                <button class="add-contact-btn" onclick="addContact()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Agregar contacto
                </button>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="../listar-rutas/index.html" class="nav-item">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L15.09 10.26H24L17.55 15.82L20.64 24L12 18.44L3.36 24L6.45 15.82L0 10.26H8.91L12 2Z" fill="currentColor"/>
                </svg>
                <span class="nav-label">RUTAS</span>
            </a>
            <a href="../mapa-ruta/index.html" class="nav-item">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" fill="currentColor"/>
                </svg>
                <span class="nav-label">MAPA</span>
            </a>
            <a href="../perfil/index.html" class="nav-item active">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" fill="currentColor"/>
                    <path d="M12 14c-6 0-8 3-8 3v7h16v-7s-2-3-8-3z" fill="currentColor"/>
                </svg>
                <span class="nav-label">PERFIL</span>
            </a>
        </nav>
    </div>

    <script>
        function editContact(id) {
            alert('Editar contacto ' + id);
        }

        function deleteContact(id) {
            if (confirm('¿Eliminar este contacto?')) {
                alert('Contacto ' + id + ' eliminado');
            }
        }

        function addContact() {
            alert('Agregar nuevo contacto de emergencia');
        }
    </script>
</body>
</html>
